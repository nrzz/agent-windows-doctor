name: e2e

# The checks that run the real agents: Claude Code, Codex CLI, Gemini CLI and GitHub Copilot CLI, installed from npm, each against a fake API on
# 127.0.0.1 (no token is spent, no login is needed), in a throwaway home behind a guard that refuses to start a binary unless every home folder is
# inside the sandbox and every proxy is a closed port. They put to the binaries which shell each agent starts for the model and how it finds it,
# what a hook is run with, what a failing hook does, the Windows sandbox of Codex, and `check --live`; test/windows.test.mjs cross-checks what the
# tool reads on Windows against PowerShell, .NET, where.exe and wsl.exe. On Windows they run in full (windows-latest has Git at
# C:\Program Files\Git and PowerShell 7 on PATH, which the machine this was written on has neither); on Linux and macOS the checks that are
# about Windows skip and the answer "nothing to check" is put to the real command line. Optional by design: an agent that cannot be installed
# skips its checks. Weekly, so a release of an agent that changes how it finds its shell shows up here.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      claude_version:
        description: "Version of @anthropic-ai/claude-code to install (default: the newest)"
        required: false
        default: "latest"
      codex_version:
        description: "Version of @openai/codex to install (default: the newest)"
        required: false
        default: "latest"
      gemini_version:
        description: "Version of @google/gemini-cli to install (default: the newest)"
        required: false
        default: "latest"
      copilot_version:
        description: "Version of @github/copilot to install (default: the newest)"
        required: false
        default: "latest"

jobs:
  agents:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Claude Code (its checks skip if this fails)
        run: npm install -g @anthropic-ai/claude-code@${{ inputs.claude_version || 'latest' }}
        continue-on-error: true
      - name: Install Codex CLI (its checks skip if this fails)
        run: npm install -g @openai/codex@${{ inputs.codex_version || 'latest' }}
        continue-on-error: true
      - name: Install Gemini CLI (its checks skip if this fails)
        run: npm install -g @google/gemini-cli@${{ inputs.gemini_version || 'latest' }}
        continue-on-error: true
      - name: Install GitHub Copilot CLI (its checks skip if this fails)
        run: npm install -g @github/copilot@${{ inputs.copilot_version || 'latest' }}
        continue-on-error: true
      - name: Versions of what was installed
        run: |
          claude --version
          codex --version
          gemini --version
          copilot --version
        continue-on-error: true
      - name: Real-binary checks
        run: node --test --test-concurrency=1 test/e2e-claude.test.mjs test/e2e-codex.test.mjs test/e2e-gemini.test.mjs test/e2e-copilot.test.mjs test/e2e-live.test.mjs test/windows.test.mjs
        env:
          E2E_CLAUDE: claude
          E2E_CODEX: codex
          E2E_GEMINI: gemini
          E2E_COPILOT: copilot
